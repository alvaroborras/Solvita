# Solvita LLM runtime configuration
# Fill required fields before running workflow.

llm:
  # Provider: openai_compatible | anthropic | dashscope
  provider: "dashscope"
  # Keep base_url non-empty for unified config validation; dashscope SDK uses api_key directly.
  base_url: "https://dashscope.aliyuncs.com/api/v1"
  api_key: "sk-<redacted>"

  # Default model for all nodes (can be overridden by roles below)
  # Note: `qwen3.*-plus` models are multimodal in DashScope; `Generation.call` in our client is the
  # text-generation path. Use a text-first model id here to avoid `InvalidParameter: url error`.
  model: "qwen-plus"
  temperature: 0.1
  max_tokens: 16384

  # Optional per-role overrides to match previous behavior
  roles:
    code:
      model: "qwen-plus"
    generator:
      model: "qwen-plus"
    validator:
      model: "qwen-plus"
    checker:
      model: "qwen-plus"
    output:
      model: "qwen-plus"
    hacker:
      model: "qwen-plus"

# Embedding backend for semantic similarity in skill_graph/question_similarity.py.
# Priority: environment variables > this YAML > hardcoded defaults.
embedding:
  # "azure_openai" or "sentence_transformers"
  provider: "azure_openai"
  model: "text-embedding-3-small"
  cache_size: 32768
  azure:
    base_url: "https://<azure-endpoint>"
    tenant_id: "<azure-tenant>"
    scope: "api://<azure-scope>/.default"
    api_version: "2025-04-01-preview"
  sentence_transformers:
    device: "cpu"
