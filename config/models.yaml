# Solvita LLM runtime configuration.
#
# Authentication is intentionally not stored in this file. The official
# OpenAI SDK reads OPENAI_API_KEY from the process environment.

llm:
  provider: "openai"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 16384
  use_responses_api: true

  roles:
    code: {model: "gpt-4o-mini"}
    plan: {model: "gpt-4o-mini"}
    solver_codegen: {model: "gpt-4o-mini"}
    generator: {model: "gpt-4o-mini"}
    validator: {model: "gpt-4o-mini"}
    checker: {model: "gpt-4o-mini"}
    output: {model: "gpt-4o-mini"}
    hacker: {model: "gpt-4o-mini"}

embedding:
  provider: "sentence_transformers"
  model: "text-embedding-3-small"
  cache_size: 32768
  http_max_retries: 5
  openai_compatible:
    base_url: ""
  azure:
    base_url: ""
    tenant_id: ""
    scope: ""
    api_version: "2025-04-01-preview"
  sentence_transformers:
    device: "cpu"
