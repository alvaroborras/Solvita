# Solvita LLM runtime configuration
# Uses Azure OpenAI (CloudGPT) with AAD authentication.
# Deployment names from CloudGPT-AOAI (Bo Qiao, MSRA CloudAI FTE).

llm:
  # Azure OpenAI endpoint (CloudGPT)
  base_url: "https://<azure-endpoint>"

  # AAD authentication (no api_key needed)
  azure_tenant_id: "<azure-tenant>"
  azure_scope: "api://<azure-scope>/.default"
  api_version: "2025-04-01-preview"

  # Default model for all nodes (CloudGPT deployment name)
  model: "gpt-5.4-20260305"
  temperature: 0.1
  max_tokens: 16384

  # Per-role overrides (use CloudGPT deployment names)
  roles:
    code:
      model: "gpt-5.4-20260305"
    generator:
      model: "gpt-5.4-20260305"
    validator:
      model: "gpt-5.4-20260305"
    checker:
      model: "gpt-5.4-20260305"
    output:
      model: "gpt-5.4-20260305"
    hacker:
      model: "gpt-5.4-20260305"

# Embedding backend for semantic similarity in skill_graph/question_similarity.py.
# Priority: environment variables > this YAML > hardcoded defaults.
embedding:
  # "azure_openai" or "sentence_transformers"
  provider: "azure_openai"
  model: "text-embedding-3-small"
  cache_size: 32768
  azure:
    base_url: "https://<azure-endpoint>"
    tenant_id: "<azure-tenant>"
    scope: "api://<azure-scope>/.default"
    api_version: "2025-04-01-preview"
  sentence_transformers:
    device: "cpu"
