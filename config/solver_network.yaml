# Skill graph / solver network runtime defaults.
# Merged into config["solver_network"] in create_initial_state (see src/graph/state.py).
# Keys passed in the outer config["solver_network"] override these values.
#
# graph_dir is relative to the Solvita repository root unless you pass an absolute path.

solver_network:
  enabled: false
  graph_dir: artifacts/solver_network/latest/graph
  top_k_problems: 4
  sample_k: 5
  temperature: 1.0
  include_skill_templates_in_augmentation: false
  skill_selection_temperature: 0.2
  skill_candidate_k: 20
  min_llm_skills: 1
  max_llm_skills: 5
  skill_selection_planner_max_chars: 3500
  # When enabled (and solver_network.enabled), run ``count`` independent skill-plan + CodeGen/Hacker tails after TestGen, merge best branch, then END (no second main-graph hacker pass).
  ensemble_skill_plans:
    enabled: false
    count: 3
    parallel: true
    max_parallel_workers: 3
    tail_recursion_limit: 600
    # When ensemble runs with benchmark_output_dir (or branch_log_dir), ``run_workflow`` creates one folder per problem:
    #   {root}/logs/ensemble_cases/{stem}/00_pre_ensemble.log  (Abstract→TestGen)
    #   {root}/logs/ensemble_cases/{stem}/branch_00.log …    (each tail branch)
    # Legacy fallback (no case folder): {root}/logs/{branch_log_subdir}/{stem}_b{id}.log
    branch_log_dir: ""
    branch_log_subdir: solvita_ensemble
    diversity:
      temperature_delta: [0.0, 0.04, -0.04]
