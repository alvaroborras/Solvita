<!DOCTYPE html>
<html lang="en">
  <body>
    <div class="problem-statement">
      <div class="header">
        <div class="title">C. Cyclic Sum</div>
        <div class="time-limit">time limit per test <span>2 seconds</span></div>
        <div class="memory-limit">memory limit per test <span>256 megabytes</span></div>
      </div>
      <div>
        <p>You are given a cyclic array and need to compute the maximum sum.</p>
      </div>
      <div class="input-specification">
        <div class="section-title">Input</div>
        <p>The only line contains integers describing the sequence.</p>
      </div>
      <div class="output-specification">
        <div class="section-title">Output</div>
        <p>Print the maximum cyclic sum.</p>
      </div>
      <div class="sample-tests">
        <div class="sample-test">
          <div class="input">
            <div class="title">Input</div>
            <pre>1 3 2<br/>1</pre>
          </div>
          <div class="output">
            <div class="title">Output</div>
            <pre>3</pre>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
